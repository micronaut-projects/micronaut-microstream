plugins {
    id 'java-library'
    id "io.micronaut.internal.build.microstream-testsuite"
    id "io.micronaut.build.internal.python"
}

// The Python compiler (micronaut-inject-python) ships with Micronaut core 5.2+, which this branch does not use: only this
// suite resolves that core version and the matching cache, serde, validation and test modules (see gradle/libs.versions.toml).
micronautBuild {
    // the Python runtime (Micronaut core 5.2) requires Java 25, unlike the rest of this branch (Java 17)
    javaVersion = 25
    python {
        compilerVersion.set(libs.versions.micronaut.python)
    }
}

dependencies {
    testImplementation(platform(libs.micronaut.core.python))
    testImplementation(platform(libs.micronaut.cache.python))
    testImplementation(platform(libs.micronaut.serde.python))
    testImplementation(platform(libs.micronaut.test.python))
    testImplementation(platform(libs.micronaut.validation.python))

    // The Python compiler (micronaut-inject-python) takes the (jar-resolved) compile classpath as its
    // annotation processor path, so the processors are testImplementation (not testAnnotationProcessor).
    testImplementation(projects.micronautMicrostreamAnnotations)
    testImplementation(libs.micronaut.inject.python.test)
    testImplementation(libs.micronaut.context.python)
    testImplementation("io.micronaut.validation:micronaut-validation-processor")
    testImplementation("io.micronaut.serde:micronaut-serde-processor")

    testImplementation("io.micronaut.validation:micronaut-validation")
    testImplementation("io.micronaut.serde:micronaut-serde-jackson")

    testImplementation(projects.micronautMicrostream)
    testImplementation(projects.micronautMicrostreamCache)
    testImplementation(projects.micronautMicrostreamRest)

    testImplementation("io.micronaut.test:micronaut-test-junit5")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine")

    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly("io.micronaut:micronaut-http-server-netty")
    testImplementation("io.micronaut:micronaut-http-server-netty")
    testImplementation("io.micronaut:micronaut-http-client")
    testRuntimeOnly(mn.snakeyaml)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "micronaut.python.pool.enabled", "false"
    // a Truffle host-interop assertion trips on varargs overloads
    enableAssertions = false
}
