pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.1.2'
}

rootProject.name = 'microstream-parent'

include 'microstream-bom'
include 'microstream'
include 'microstream-annotations'
include 'microstream-rest'
include 'microstream-cache'

include 'test-suite'
include 'test-suite-utils'
include 'test-suite-groovy'
include 'test-suite-kotlin'
include 'test-suite-python'

micronautBuild.useStandardizedProjectNames=true

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-aws")
    importMicronautCatalog("micronaut-cache")
    importMicronautCatalog("micronaut-micrometer")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-sql")
    importMicronautCatalog("micronaut-test-resources")
    importMicronautCatalog("micronaut-validation")
}
