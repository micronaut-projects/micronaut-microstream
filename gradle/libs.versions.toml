[versions]
micronaut-docs = "2.0.0"
micronaut = "4.9.3"
groovy = "4.0.14"
kotlin = '2.1.21'
spock = "2.3-groovy-4.0"
managed-microstream='08.01.02-MS-GA'

micronaut-aws = "4.10.0"
micronaut-cache = "5.2.0"
micronaut-logging = "1.6.1"
micronaut-micrometer = "5.11.0"
micronaut-serde = "2.14.1"
micronaut-sql = "6.1.1"
micronaut-test = "4.7.0"
micronaut-test-resources = "2.8.0"
micronaut-validation = "4.9.0"

# The Python compiler (micronaut-inject-python) of test-suite-python ships with Micronaut core 5.2+, which this branch
# does not use: only that suite resolves these Micronaut 5 versions of core, cache, serde, validation and test
micronaut-python = "5.2.2"
micronaut-cache-python = "6.1.1"
micronaut-serde-python = "3.1.1"
micronaut-test-python = "5.1.1"
micronaut-validation-python = "5.1.0"

[libraries]
micronaut-aws = { module = "io.micronaut.aws:micronaut-aws-bom", version.ref = "micronaut-aws" }
# Required to get dependabot updates for micronaut-core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }
micronaut-cache = { module = "io.micronaut.cache:micronaut-cache-bom", version.ref = "micronaut-cache" }
micronaut-micrometer = { module = "io.micronaut.micrometer:micronaut-micrometer-bom", version.ref = "micronaut-micrometer" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-sql = { module = "io.micronaut.sql:micronaut-sql-bom", version.ref = "micronaut-sql" }
micronaut-test-resources = { module = "io.micronaut.testresources:micronaut-test-resources-bom", version.ref = "micronaut-test-resources" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }

micronaut-core-python = { module = "io.micronaut:micronaut-core-bom", version.ref = "micronaut-python" }
micronaut-inject-python-test = { module = "io.micronaut:micronaut-inject-python-test" }
micronaut-context-python = { module = "io.micronaut:micronaut-context-python" }
micronaut-cache-python = { module = "io.micronaut.cache:micronaut-cache-bom", version.ref = "micronaut-cache-python" }
micronaut-serde-python = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde-python" }
micronaut-test-python = { module = "io.micronaut.test:micronaut-test-bom", version.ref = "micronaut-test-python" }
micronaut-validation-python = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation-python" }

managed-microstream-aws-s3 = { module = 'one.microstream:microstream-afs-aws-s3', version.ref = 'managed-microstream' }
managed-microstream-aws-dynamodb = { module = 'one.microstream:microstream-afs-aws-dynamodb', version.ref = 'managed-microstream' }
managed-microstream-sql = { module = 'one.microstream:microstream-afs-sql', version.ref = 'managed-microstream' }
managed-microstream-storage-embedded-configuration = { module = 'one.microstream:microstream-storage-embedded-configuration', version.ref = 'managed-microstream' }
managed-microstream-cache = { module = 'one.microstream:microstream-cache', version.ref = 'managed-microstream' }
managed-microstream-storage-restservice = { module = 'one.microstream:microstream-storage-restservice', version.ref = 'managed-microstream' }

microstream-rest-gui = { module = 'one.microstream:microstream-storage-restclient-app', version.ref = 'managed-microstream' }
microstream-persistence-binary-jdk8 = { module = 'one.microstream:microstream-persistence-binary-jdk8', version.ref = 'managed-microstream' }
microstream-persistence-binary-jdk17 = { module = 'one.microstream:microstream-persistence-binary-jdk17', version.ref = 'managed-microstream' }

testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
jupiter-jupiter-params = { module = 'org.junit.jupiter:junit-jupiter-params' }
jupiter-api = { module = 'org.junit.jupiter:junit-jupiter-api' }
junit-jupiter-engine = { module = 'org.junit.jupiter:junit-jupiter-engine' }
kotlin-stdlib = { module = 'org.jetbrains.kotlin:kotlin-stdlib-jdk8', version.ref = 'kotlin' }

gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
